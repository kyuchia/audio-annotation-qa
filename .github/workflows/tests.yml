name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      # Backend, run the way it runs locally. Compose mounts the checkout at /app, which
      # is where the tests read docker-compose.yml, frontend/vite.config.js and
      # .dockerignore from. --wait returns once the database reports healthy.
      - name: Start the database and Django
        run: docker compose up -d --build --wait db django

      - name: Run the Django tests
        run: docker compose exec -T django python manage.py test annotations

      - name: Show container logs
        if: failure()
        run: docker compose logs --no-color

      # Frontend, on the Node version docker-compose.yml runs it with (node:20-slim).
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build the frontend
        working-directory: frontend
        run: npm run build
